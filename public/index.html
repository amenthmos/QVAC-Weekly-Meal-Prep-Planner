<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Weekly Meal Prep Planner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #fff0e8 0%, #ffe0cf 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #6b3320;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .icon { font-size: 2rem; margin-bottom: 4px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #c1521f; font-weight: 800; text-align: center; }
  .subtitle { color: #966347; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fffaf6; border: 1px solid #ffd7b8; border-radius: 16px; padding: 28px 26px; box-shadow: 0 4px 16px rgba(193,82,31,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #6b3320; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #ffcaa3;
    background: #fffdfb; color: #6b3320; font-family: inherit; font-size: 1rem; margin-bottom: 18px;
  }
  input[type=text]:focus { outline: none; border-color: #c1521f; }
  button.action {
    width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer; background: #c1521f; color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #a1421a; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #966347; min-height: 1.2em; }
  #resultBox { margin-top: 18px; }
  ol.steps { padding-left: 22px; margin: 0; }
  ol.steps li { margin-bottom: 10px; line-height: 1.5; }
  .footer-note { color: #966347; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #ffd7b8;
    border-top-color: #c1521f; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🍱</div>
    <h1>Weekly Meal Prep Planner</h1>
    <p class="subtitle">Enter your diet and prep days, get a batch-cook outline. 100% on-device.</p>

    <div class="card">
      <label for="prefInput">Dietary preference</label>
      <input type="text" id="prefInput" placeholder="e.g. vegetarian, high-protein, low-carb" />
      <label for="daysInput">Days you want to prep for</label>
      <input type="text" id="daysInput" placeholder="e.g. 5" />
      <button class="action" id="generateBtn">Plan My Week</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const prefInput = document.getElementById('prefInput');
    const daysInput = document.getElementById('daysInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const preference = prefInput.value.trim();
      const days = daysInput.value.trim();
      if (!preference) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Planning your week...';

      try {
        const res = await fetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ preference, days }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `
          <div style="font-size:0.85rem;color:#966347;margin-bottom:8px;">Batch-cook plan for ${data.days} day(s), ${escapeHtml(data.preference)}:</div>
          <ol class="steps">${data.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
        `;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    daysInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
